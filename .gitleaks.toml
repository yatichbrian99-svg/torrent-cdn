# gitleaks config — TorrentCDN
#
# Extends the default ruleset (all built-in secret patterns stay active) and
# allowlists only *placeholder values* the default rules legitimately flag as
# false positives:
#
#   - truncated JWT-shaped doc examples ("eyJhbGciOiJIUzI1NiIs...")
#   - curl examples whose token is the literal word `YOUR_TOKEN`/`YOUR_API_KEY`
#   - the env-template pattern `FOO_SECRET=` followed by `FOO_SECRET_ID=v1`,
#     where the entropy rule captures the NEXT variable's name as the "secret"
#   - published test vectors (RFC 6238 Appendix B, the SDK docs MFA example)
#   - the throwaway probe password from an earlier commit of
#     scripts/live_ai_journey.py (the script now generates it per run)
#
# NO entry is scoped to a path or a whole file. An earlier revision of this file
# allowlisted `.env.example`, frontend/app/docs/page.tsx and frontend/app/page.tsx
# wholesale, which meant a real credential pasted into any of them sailed past
# the gate — verified: a planted `ghp_...` token in all three files yields 0
# findings with that revision and 3 with this one. Everything below matches a
# VALUE, so any other value in the same file still fails;
# `backend/scripts/secret_scan.sh --full` (high-signal patterns over the whole
# tree, never allowlisted) covers those files as well.
title = "gitleaks config"

[extend]
useDefault = true

# Match against the captured SECRET, not the line: each pattern below is the
# exact placeholder value a rule reported, wherever it appears.
[allowlist]
description = "Placeholder VALUES only (published test vectors, doc examples) — never a path"
regexTarget = "secret"
regexes = [
  # Truncated JWT-shaped examples in the API docs / homepage, e.g.
  #   "access_token": "eyJhbGciOiJIUzI1NiIs..."
  '''^eyJhbGciOiJIUzI1NiIs''',
  # curl examples with explicit placeholder tokens:
  #   -H "Authorization: Bearer YOUR_TOKEN"
  #   curl -H 'Authorization: Bearer YOUR_API_KEY' ...
  # (the curl rule reports the token itself, without the `Bearer ` prefix)
  '''^YOUR_(TOKEN|API_KEY)$''',
  # `.env.example` documents `TCDN_AI_API_KEY_PEPPER=` (empty) immediately
  # followed by `TCDN_AI_API_KEY_PEPPER_ID=v1`; the entropy rule captures the
  # next variable's assignment as the "value". A bare `NAME_ID=vN` is not a
  # secret — a real value on either line is a different string and still fails.
  '''^[A-Z][A-Z0-9_]*_ID=v[0-9]+$''',
  # The RFC 6238 Appendix B test vector (TOTP correctness oracle in
  # backend/tests/test_mfa.py): base32 of the ASCII string
  # "12345678901234567890". Published in the RFC, never a credential.
  '''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''',
  # The published SDK docs MFA example secret.
  '''^JBSWY3DPEHPK3PXP$''',
  # The throwaway probe account password from an earlier commit of
  # scripts/live_ai_journey.py; the script now generates it per run.
  '''^Journey-pass-9812$''',
]
