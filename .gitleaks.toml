# Gitleaks configuration.
#
# The default rule set stays fully on. This file only allowlists places where a
# value-shaped PLACEHOLDER is legitimate, and every entry is kept as narrow as
# possible because an allowlist entry is exactly where a real secret could hide.
#
# Why the env templates are allowed:
#   `.env.example` documents every variable by name. Rules like
#   generic-api-key fire on `SOMETHING_SECRET=` followed by a short id line
#   (e.g. `TCDN_AI_API_KEY_PEPPER=` + `TCDN_AI_API_KEY_PEPPER_ID=v1`) purely on
#   entropy, with no secret present. Two gates still cover that file:
#     * `backend/scripts/secret_scan.sh --full` scans the whole tree with the
#       high-signal patterns (PATs, live keys, private-key blocks) and is NOT
#       allowlisted, so a real token pasted into a template still fails CI;
#     * this allowlist is path-scoped to `*.example` templates only.
[extend]
useDefault = true

[allowlist]
description = "Committed env templates and documentation examples: placeholders, never real values"
paths = [
  '''^\.env\.example$''',
  '''^frontend/\.env\.example$''',
  # Documentation pages whose whole purpose is to show example calls, including
  # `Authorization: Bearer <key>` and "access_token": "…" snippets. A REAL
  # secret pasted here is still caught by backend/scripts/secret_scan.sh, whose
  # high-signal patterns run over the whole tree and are not allowlisted.
  '''^frontend/app/docs/page\.tsx$''',
  '''^frontend/app/page\.tsx$''',
]

# Exact placeholder values flagged by entropy-based rules. Matched literally, so
# a DIFFERENT value in the same file still fails.
regexes = [
  # The throwaway probe account password from an earlier commit of
  # scripts/live_ai_journey.py; the script now generates it per run.
  '''Journey-pass-9812''',
  # RFC 6238 Appendix B test secret (base32 of "12345678901234567890"), used
  # as a correctness fixture in tests/test_mfa.py. Published in the RFC.
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  '''JBSWY3DPEHPK3PXP''',
]
