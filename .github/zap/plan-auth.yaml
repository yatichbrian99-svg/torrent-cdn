# ZAP Automation Framework plan — authenticated pass.
#
# Identical to plan-unauth.yaml except that the target is the runner's auth
# proxy (:8001) instead of the backend (:8000). The proxy adds the seeded
# account's bearer token to every request on the way through — see
# auth_proxy.py for why a ZAP Replacer rule was not enough. The token itself
# never appears in this file, in the checkout or in the uploaded artifact.
env:
  contexts:
    - name: torrentcdn
      # The context URL is spidered as a seed, so it must answer 200: the
      # API root is a 404 and ZAP records that as a plan warning.
      urls:
        - http://127.0.0.1:8001/health
      includePaths:
        - http://127.0.0.1:8001.*
      excludePaths:
        - http://127.0.0.1:8001/api/internal/.*
  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: openapi
    parameters:
      apiFile: /zap/wrk/api.json
      targetUrl: http://127.0.0.1:8001
      context: torrentcdn

  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 20
      scanOnlyInScope: true

  # Start at a URL that answers 200 (the API root is a 404; a job warning makes
  # ZAP exit non-zero and would mask a real scanner failure).
  - type: spider
    parameters:
      context: torrentcdn
      url: http://127.0.0.1:8001/health
      maxDuration: 2

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: torrentcdn
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 6

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/reports
      reportFile: auth.json

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/reports
      reportFile: auth.html

  - type: report
    parameters:
      template: traditional-md
      reportDir: /zap/wrk/reports
      reportFile: auth.md
