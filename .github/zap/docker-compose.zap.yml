# CI-only compose override for the ZAP scan (.github/workflows/dast-zap.yml).
#
# It puts the backend in the shape the staging blueprint describes —
# APP_ENV=production and TCDN_AI_ENVIRONMENT=production so the *production*
# config gates run, plus STAGING_DEPLOYMENT=true so a live Paystack key is
# refused — and turns the AI flag ON so the /api/ai/v1 surface exists to scan.
#
# The values are empty-by-default references, NOT `:?` guards: the keyring is
# generated by the workflow itself (in-container, thrown away with the runner)
# and must be able to be absent while the image is being built / while that
# one-off command runs.
services:
  backend:
    # gunicorn disables its access log by default and the image's CMD sets no
    # --access-logfile. The workflow needs it to prove the authenticated ZAP
    # pass really carried the session token (.github/zap/authme.sh), so this
    # stack turns it on: same server, same workers, one extra log line per
    # request.
    # `--config gunicorn_conf.py` is the same flag the image's CMD uses: without
    # it this override would scan a server that still advertises
    # `gunicorn/<version>`, and the Server-header fix would look green while the
    # scanned process never loaded it.
    command: sh -c "gunicorn app.main:app --config gunicorn_conf.py --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --access-logfile - --timeout 120 --keep-alive 5"
    environment:
      APP_ENV: production
      # Never a real host: this stack answers on 127.0.0.1 only, and nothing it
      # emits (verification links, CSP) is delivered to a browser.
      APP_URL: https://zap.ci.invalid
      STAGING_DEPLOYMENT: "true"

      ENABLE_TCDN_AI: "true"
      TCDN_AI_ENVIRONMENT: production
      # Declaration only (config.py checks it at startup; no request-time
      # enforcement), so plain HTTP on loopback is fine for a scanner target.
      TCDN_AI_REQUIRE_TLS: "true"
      TCDN_AI_ALLOW_SIMULATED_ATTESTATION: "false"
      TCDN_AI_ALLOW_DEV_STUB_BACKEND: "false"
      TCDN_AI_PAYMENT_PROVIDER: paystack
      TCDN_AI_PAYSTACK_SECRET_KEY: ${TCDN_AI_PAYSTACK_SECRET_KEY:-}
      TCDN_AI_API_KEY_PEPPER: ${TCDN_AI_API_KEY_PEPPER:-}
      TCDN_AI_COORDINATOR_KEYRING_JSON: ${TCDN_AI_COORDINATOR_KEYRING_JSON:-}
      TCDN_AI_SIGNUP_CREDITS: "500"
      # Staging's documented exception so registration auto-verifies without a
      # mail provider; config.py refuses it outside STAGING_DEPLOYMENT.
      TCDN_AI_SIGNUP_ALLOW_AUTO_VERIFIED: "true"

      # ── Scanner-shaped settings, stated rather than hidden ────────────────
      # Login must mint a session for the seeded account. Production requires
      # 2FA enrollment by default and returns only an mfa_token, which would
      # make the authenticated pass impossible without a TOTP client here.
      MFA_REQUIRED: "false"
      # The per-IP global limit (300/min) is a product control; leaving it at
      # its default makes a scan of ~100 endpoints report 429s instead of
      # responses. Raised for the scanner only — the per-key AI limiter and every
      # other throttle are untouched, so they are still scanned as shipped.
      RATE_LIMIT_GLOBAL: "20000"
