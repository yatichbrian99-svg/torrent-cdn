name: "CI: Full-stack Docker audit"

# Path-filtered to moderate Actions usage: spinning up the real Docker stack
# (Postgres + Redis + MinIO + a production-mode backend build + the curl audit)
# costs ~5-8 min, so it runs only when the backend or infrastructure actually
# changed. A frontend-only change cannot break this audit — the frontend has
# its own checks (frontend-checks) and the E2E delivery gate (ci-e2e.yml).
# The daily 04:00 secret re-scan in security.yml covers the full-history
# gitleaks pass, so this workflow needs no schedule of its own.
#
# This workflow is deliberately INDEPENDENT of the secret gates in
# security.yml: when the paths match it always runs, even if gitleaks or
# secret-scan failed on the same push (preserving the old `if: always()`
# intent — a leak PR still gets its Docker e2e signal; the leak itself is
# caught by the failing gates).
on:
  push:
    # fix/tcdn-ai-redis-replay-nonce is listed ONLY so the TCDN-AI trial push
    # produces a real run. Every workflow in this repo gates push to main, and
    # this one has no workflow_dispatch on the default branch, so a feature
    # branch could not otherwise be exercised at all. Remove the branch before
    # this merges.
    branches: [main, fix/tcdn-ai-redis-replay-nonce]
    paths:
      - "backend/**"
      - "Caddyfile"
      - "docker-compose.yml"
      - "render.yaml"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "Caddyfile"
      - "docker-compose.yml"
      - "render.yaml"
      - ".github/**"

# Least privilege: contents read.
permissions:
  contents: read

# Push and PR runs keyed on the ref — cancel-in-progress drops stale runs so
# the queue never stacks (the audit is idempotent; the last state wins).
concurrency:
  group: ci-fullstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Full-stack audit (requires Docker) ──
  # Brings up the real Postgres/Redis/MinIO stack + a production-mode backend
  # build and runs the curl audit against it (migrations, lazy table creation,
  # health, auth, upload flow, Caddy-proxy headers). Catches startup/schema/
  # config regressions the fully-mocked unit suite can't. Path-scoped (above):
  # backend/ or infrastructure-only pushes pay for it; frontend-only pushes
  # skip it.
  fullstack-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Note: compose interpolates the whole file, so JWT_SECRET must be set here
      # too even though the backend service isn't started in this step.
      - name: Start infrastructure (Postgres, Redis, MinIO)
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          POSTGRES_PASSWORD: ci-test-password
          MINIO_ROOT_PASSWORD: ci-test-minio-password
          # Compose interpolates the WHOLE file, so the mediamtx service's
          # fail-closed ${MEDIAMTX_HOOK_SECRET:?} breaks even `up postgres redis
          # minio` without a value. CI-only dummy — the mediamtx service is not
          # started by this job.
          MEDIAMTX_HOOK_SECRET: "ci-test-hook-secret"
        run: |
          docker compose up -d postgres redis minio
          echo "Waiting for services to be healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker compose ps --format '{{.Status}}' | grep -c 'healthy' || true)
            [ "$STATUS" -ge 3 ] && echo "All services healthy" && break
            sleep 3
          done
          # Fail hard if infra never becomes healthy instead of letting the
          # backend step diagnose it blind (the backend health wait is still a
          # second gate, but the failure should point here first).
          if [ "$STATUS" -lt 3 ]; then
            echo "Infrastructure never became healthy ($STATUS/3) — aborting" >&2
            docker compose ps
            exit 1
          fi

      - name: Build and start backend
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          POSTGRES_PASSWORD: ci-test-password
          MINIO_ROOT_PASSWORD: ci-test-minio-password
          # Compose interpolates the WHOLE file, so the mediamtx service's
          # fail-closed ${MEDIAMTX_HOOK_SECRET:?} breaks even `up postgres redis
          # minio` without a value. CI-only dummy — the mediamtx service is not
          # started by this job.
          MEDIAMTX_HOOK_SECRET: "ci-test-hook-secret"
        run: |
          docker compose build backend
          APP_ENV="production" \
            docker compose up -d backend
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            CODE=$(curl -so /dev/null -w '%{http_code}' http://localhost:8000/health 2>/dev/null || echo "000")
            [ "$CODE" = "200" ] && echo "Backend healthy" && break
            sleep 3
          done
          if [ "$CODE" != "200" ]; then
            echo "Backend never became healthy on :8000" >&2
            docker compose logs backend --tail 40 2>&1
            exit 1
          fi

      # This job runs from the repo root (no working-directory default, since the
      # docker compose steps need the root-level compose file), so reference the
      # audit script by its full path under backend/.
      - name: Run full-stack curl audit
        run: bash backend/scripts/curl_audit.sh
        env:
          API_URL: "http://localhost:8000"

      # Compose interpolates the whole file, so the required env vars must be
      # present even for teardown (docker compose down -v).
      - name: Cleanup
        if: always()
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          POSTGRES_PASSWORD: ci-test-password
          MINIO_ROOT_PASSWORD: ci-test-minio-password
          # Compose interpolates the WHOLE file, so the mediamtx service's
          # fail-closed ${MEDIAMTX_HOOK_SECRET:?} breaks even `up postgres redis
          # minio` without a value. CI-only dummy — the mediamtx service is not
          # started by this job.
          MEDIAMTX_HOOK_SECRET: "ci-test-hook-secret"
        run: docker compose down -v

  # ── TCDN-AI: Postgres + Redis-backed store tests ──
  # These tests prove the real PostgresStore and the Redis-backed ticket replay /
  # attestation nonce / rate-limit paths against real Postgres and real Redis.
  # Both are real service containers started here, and both are handed to the
  # tests as DATABASE_URL/REDIS_URL, plus TEST_POSTGRES_URL for the money-path
  # lane in tests/test_ai_postgres.py (which skipif's on it, so it MUST be set
  # or the lane proves nothing). The in-process and fake-Redis break-tests are
  # covered there too; they do not need these containers but share the job.
  ai-store:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start infrastructure (Postgres, Redis)
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          POSTGRES_USER: user
          POSTGRES_PASSWORD: ci-test-password
          MINIO_ROOT_PASSWORD: ci-test-minio-password
          MEDIAMTX_HOOK_SECRET: "ci-test-hook-secret"
        # `pg_isready` is run INSIDE the container rather than on the runner:
        # the runner image happens to ship a Postgres client today, but the only
        # client guaranteed to exist here is the one in the postgres image.
        # Role/db come from the same variables compose inits the cluster with
        # (POSTGRES_USER default `user`, POSTGRES_DB always `torrentcdn`); the
        # probe is a liveness check, but naming them correctly keeps it honest.
        run: |
          set -euo pipefail
          docker compose up -d postgres redis
          for _ in $(seq 1 40); do
            docker compose exec -T postgres \
              pg_isready -U "${POSTGRES_USER}" -d torrentcdn >/dev/null 2>&1 && break
            sleep 2
          done
          if ! docker compose exec -T postgres pg_isready -U "${POSTGRES_USER}" -d torrentcdn; then
            echo "Postgres never became ready" >&2
            exit 1
          fi
          for _ in $(seq 1 40); do
            docker compose exec -T redis redis-cli ping >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose exec -T redis redis-cli ping

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python deps
        run: |
          set -euo pipefail
          cd backend
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt -r requirements-dev.txt

      # The paths below are relative to backend/ (the step's cwd). They used to
      # be prefixed with `backend/`, which pytest resolved to
      # backend/backend/tests/... — a usage error (exit 4) that collected no
      # tests at all.
      #
      # The trailing `echo "...exit code $$?"` is gone. It never masked a
      # failure (GitHub already runs bash with -e, so the step aborted on
      # pytest's own status) — but it printed the shell PID and a literal `?`,
      # e.g. "exit code 617972?", so the log reported a number that looked like
      # an exit code and was not one. `set -euo pipefail` below is explicit so
      # the real status propagates even if that default ever changes.
      - name: Run Postgres + Redis-backed AI tests
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          POSTGRES_USER: user
          POSTGRES_PASSWORD: ci-test-password
          MINIO_ROOT_PASSWORD: ci-test-minio-password
          MEDIAMTX_HOOK_SECRET: "ci-test-hook-secret"
          REDIS_URL: redis://127.0.0.1:6379/0
          TCDN_AI_ENVIRONMENT: development
          TCDN_AI_API_KEY_PEPPER: ci-test-ai-pepper-32-chars-ok!!!
          ENABLE_TCDN_AI: "true"
        run: |
          set -euo pipefail
          cd backend
          # Build the DSN from the container's OWN credentials instead of
          # restating them. The previous job hard-coded
          # `tcdn:tcdn@127.0.0.1:5432/tcdn`, but the compose service inits
          # `${POSTGRES_USER:-user}` / `torrentcdn` — so every connection was
          # rejected and the lane could never have passed, even with the paths
          # and exit status fixed.
          export DATABASE_URL="postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@127.0.0.1:5432/torrentcdn"
          # tests/test_ai_postgres.py is skipif'd on this variable. Unset, it
          # skipped silently and the job went green having proved nothing.
          export TEST_POSTGRES_URL="$DATABASE_URL"
          .venv/bin/python -m pytest tests/test_ai_core.py tests/test_ai_redis.py \
            -q --tb=short --no-header
          .venv/bin/python -m pytest tests/test_ai_postgres.py \
            -q --tb=short --no-header -rs

      - name: Cleanup
        if: always()
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          POSTGRES_PASSWORD: ci-test-password
          MINIO_ROOT_PASSWORD: ci-test-minio-password
          MEDIAMTX_HOOK_SECRET: "ci-test-hook-secret"
        run: docker compose down -v
