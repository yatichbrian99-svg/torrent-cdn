name: backend-lint

# Keep the FastAPI backend lint-clean on every push/PR to main. Uses the same
# ruff version pinned for local development (backend/.venv) and the same
# Python version as backend/Dockerfile (3.11) so CI and local runs agree.
on:
  push:
    # Temporary: the TCDN-AI trial push, to get a real lint run on the branch.
    # Remove fix/tcdn-ai-redis-replay-nonce before this merges.
    branches: [main, fix/tcdn-ai-redis-replay-nonce]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.16.3

      - name: Lint backend (app, tests, scripts)
        working-directory: backend
        run: ruff check app tests scripts

  # ── TCDN-AI: formatting + types (scoped on purpose) ──
  # The AI package and its SDK are new code and are held to `ruff format` and a
  # non-strict mypy. The legacy backend is NOT: it is unannotated by design and
  # imposing either check on it would be a rewrite rather than a gate.
  ai-types:
    name: ruff format + mypy (TCDN-AI only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # This is also the install-from-scratch proof for 1.3: a bare runner, no
      # pre-warmed venv, dependencies resolved from the committed requirement
      # files only.
      - name: Install dev dependencies from scratch
        run: pip install -r backend/requirements-dev.txt

      - name: Formatting (app/ai + SDK)
        working-directory: backend
        run: ruff format --check app/ai tcdn_ai_sdk

      - name: Types, non-strict (app/ai + SDK)
        working-directory: backend
        run: mypy --config-file mypy-ai.ini
