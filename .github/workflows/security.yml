name: Security Header Audit

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/security.yml"

jobs:
  # ── Static audit (no infra required) ──
  static-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run static security header audit
        run: python scripts/security_audit.py
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          APP_ENV: "production"

  # ── Full-stack audit (requires Docker) ──
  fullstack-audit:
    runs-on: ubuntu-latest
    needs: static-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start infrastructure (Postgres, Redis, MinIO)
        run: |
          docker compose up -d postgres redis minio
          echo "Waiting for services to be healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker compose ps --format '{{.Status}}' | grep -c 'healthy' || true)
            [ "$STATUS" -ge 3 ] && echo "All services healthy" && break
            sleep 3
          done

      - name: Build and start backend
        run: |
          docker compose build backend
          JWT_SECRET="ci-test-secret-that-is-at-least-32-chars!!" \
            APP_ENV="production" \
            docker compose up -d backend
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            CODE=$(curl -so /dev/null -w '%{http_code}' http://localhost:8000/health 2>/dev/null || echo "000")
            [ "$CODE" = "200" ] && echo "Backend healthy" && break
            sleep 3
          done

      - name: Run full-stack curl audit
        run: bash scripts/curl_audit.sh
        env:
          API_URL: "http://localhost:8000"

      - name: Cleanup
        if: always()
        run: docker compose down -v
