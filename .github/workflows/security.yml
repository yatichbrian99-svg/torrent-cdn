name: "CI: Tests & Security Audits"

# No paths filter: tests + audits (incl. the gitleaks secret scan) run on
# every push/PR to main — a secret committed anywhere (frontend/, Caddyfile,
# docker-compose.yml, root files) must never escape the scan.
#
# Daily cron + manual dispatch re-scan the FULL history: push-time gitleaks
# only scans the pushed range, so a secret that slipped through an old commit
# (e.g. before gitleaks was added) is only caught by a full-history scan.
# Gitleaks on schedule/dispatch scans the whole repo (no commit range).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"  # daily 04:00 UTC full-history re-scan
  workflow_dispatch:      # manual "re-scan everything now" button

# Least privilege: contents read is all most jobs need. security-events: write
# is granted only to the static-audit job (job-level permissions), required by
# its SARIF upload step (posts gitleaks findings to Code Scanning).
permissions:
  contents: read

# Schedule + manual dispatch runs get their own concurrency group ('cron'):
# on schedule events github.ref is the default branch, so without this a
# coincidental push would share the group and cancel-in-progress would kill
# the daily scan. workflow_dispatch gets the same group so a manual re-scan
# can't cancel an in-flight push (which would skip its fullstack-audit).
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'cron' || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Diff-scoped secret gate (fast, no infra) ──
  # Fails the build the moment a high-signal secret (GitHub PAT, AWS/Stripe/
  # SendGrid/Resend key, private key, …) lands in the changeset — with a
  # readable message. Gitleaks (in static-audit) remains the full-history
  # backstop; this gate catches new secrets in seconds.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (full history for an accurate diff base)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Diff-scoped scan only makes sense for push/PR events (on schedule /
      # dispatch there is no "before" commit — gitleaks covers full history
      # there, and the --full step below covers the whole tree).
      - name: Scan the changeset for committed secrets
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=""
          fi
          bash backend/scripts/secret_scan.sh "$BASE"

      # Belt-and-braces: also scan the whole working tree as committed. On
      # schedule/dispatch runs this (with gitleaks' full-history scan) is the
      # entire daily re-check.
      - name: Scan the full tree for committed secrets
        run: bash backend/scripts/secret_scan.sh --full
  # ── Frontend asset guards (fast, no infra) ──
  # Fails if link-preview cards would render broken: og:image / twitter:image
  # in layout.tsx must resolve to a real, non-empty PNG under public/ (a prior
  # regression shipped a 0-byte dynamic route + a 404 twitter image, blanking
  # every preview card on Twitter/X, LinkedIn, Slack, Discord, WhatsApp).
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: OG image guard
        run: bash frontend/scripts/check_og_image.sh

  # ── Backend unit test suite (fully mocked — no infra required) ──
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          APP_ENV: "development"

  # ── Static audit (no infra required) ──
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-scoped least privilege: security-events: write for the SARIF upload
    # (Code Scanning); pull-requests: write so gitleaks can post inline review
    # comments on PRs where a leak is introduced (GITLEAKS_ENABLE_COMMENTS).
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    defaults:
      run:
        working-directory: backend

    steps:
      # Full history required: gitleaks-action computes a BASE^..HEAD range on
      # push events, which fails with 'fatal: ambiguous argument' against the
      # default shallow (fetch-depth: 1) checkout whenever a push contains
      # more than one commit (seen on the dashboard + chore(ops) runs).
      - name: Checkout (full history for gitleaks range resolution)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # v3 (not v2): v2 runs on Node 20, which GitHub removes from hosted
      # runners on 2026-09-16 — v2 would stop working entirely.
      # GITLEAKS_ENABLE_COMMENTS: gitleaks-action posts inline review comments
      # on PRs when it finds a leak (needs the pull-requests: write permission
      # above). Default is true, but set explicitly so it's documented. Only
      # pull_request runs have a PR to comment on — push/schedule/dispatch runs
      # simply have no PR context and skip commenting.
      - name: Gitleaks — scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"

      # Posts gitleaks results.sarif to Code Scanning (Security tab). Runs even
      # when gitleaks finds a leak, so the alert lands in the Security tab.
      # (gitleaks itself still fails the build via its exit code on findings.)
      # continue-on-error: code scanning needs Advanced Security on private
      # personal-account repos; if the upload is unsupported there, the gitleaks
      # scan (the actual gate) still runs and fails the build — the upload just
      # can't break CI. Check the Security tab after the first run to confirm
      # findings are landing.
      - name: Upload SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run static security header audit
        run: python scripts/security_audit.py
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          APP_ENV: "production"

  # ── Full-stack audit (requires Docker) ──
  # Push/PR only: the daily cron exists to re-scan secrets (gitleaks full
  # history + secret-scan --full), not to rebuild Docker nightly.
  fullstack-audit:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [static-audit, secret-scan]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Note: compose interpolates the whole file, so JWT_SECRET must be set here
      # too even though the backend service isn't started in this step.
      - name: Start infrastructure (Postgres, Redis, MinIO)
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          POSTGRES_PASSWORD: ci-test-password
          MINIO_ROOT_PASSWORD: ci-test-minio-password
        run: |
          docker compose up -d postgres redis minio
          echo "Waiting for services to be healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker compose ps --format '{{.Status}}' | grep -c 'healthy' || true)
            [ "$STATUS" -ge 3 ] && echo "All services healthy" && break
            sleep 3
          done

      - name: Build and start backend
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          POSTGRES_PASSWORD: ci-test-password
          MINIO_ROOT_PASSWORD: ci-test-minio-password
        run: |
          docker compose build backend
          APP_ENV="production" \
            docker compose up -d backend
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            CODE=$(curl -so /dev/null -w '%{http_code}' http://localhost:8000/health 2>/dev/null || echo "000")
            [ "$CODE" = "200" ] && echo "Backend healthy" && break
            sleep 3
          done
          if [ "$CODE" != "200" ]; then
            echo "Backend never became healthy on :8000" >&2
            docker compose logs backend --tail 40 2>&1
            exit 1
          fi

      # This job runs from the repo root (no working-directory default, since the
      # docker compose steps need the root-level compose file), so reference the
      # audit script by its full path under backend/.
      - name: Run full-stack curl audit
        run: bash backend/scripts/curl_audit.sh
        env:
          API_URL: "http://localhost:8000"

      # Compose interpolates the whole file, so the required env vars must be
      # present even for teardown (docker compose down -v).
      - name: Cleanup
        if: always()
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars!!"
          POSTGRES_PASSWORD: ci-test-password
          MINIO_ROOT_PASSWORD: ci-test-minio-password
        run: docker compose down -v
