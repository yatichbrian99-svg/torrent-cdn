name: "Dependency Audit"

# Automated dependency advisory checks:
#   - Daily 06:00 UTC cron — catches NEW advisories in the lockfiles without
#     anyone having to remember to run an audit (pip-audit + npm audit read the
#     pinned lockfiles, so the report reflects exactly what would ship).
#   - pull_request — every PR gets the audit report posted/updated as a comment,
#     so a dependency bump that drags in a new advisory is visible in review.
#   - workflow_dispatch — manual "audit now" button.
#
# The job fails the build ONLY on CRITICAL advisories. The known accepted
# `ip`-via-webtorrent highs (tracked in SECURITY.md → Hardening Log) stay green
# but are listed in every report — hard-failing on them would make CI
# permanently red with no action possible (the only "fix" is a webtorrent
# downgrade that destroys P2P). New critical advisories, by contrast, deserve
# to block a merge.
on:
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: contents read to check out, pull-requests write to post the
# report comment. The bot comment uses the issue-comment API (PRs are issues).
permissions:
  contents: read
  pull-requests: write

# Scheduled + manual runs share a group so a long audit can't overlap the next
# cron; PR runs are keyed on the PR ref so concurrent PRs don't cancel each
# other. cancel-in-progress keeps the queue from stacking up.
concurrency:
  group: dep-audit-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'cron' || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # pip-audit audits the INSTALLED environment, so install the pinned
      # requirements first — the report then reflects exactly what would ship
      # (same resolution the tests job uses).
      - name: Install backend deps + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      # npm audit reads package-lock.json — no npm ci needed (and none of the
      # build cost). Cache the npm registry metadata to keep the cron fast.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Run both audits; capture the report + summary line. The script lives in
      # backend/scripts so the same report can be produced locally:
      #   python backend/scripts/dependency_audit_report.py
      - name: Run pip-audit + npm audit
        id: audit
        run: |
          AUDIT_SUMMARY=$(python scripts/dependency_audit_report.py --output /tmp/audit-report.md)
          echo "$AUDIT_SUMMARY"
          echo "summary=$AUDIT_SUMMARY" >> "$GITHUB_OUTPUT"
          # Machine-gate: fail only on critical. (Script exit is always 0 when
          # the tools ran; non-critical findings are reported, not fatal.)
          CRIT=$(echo "$AUDIT_SUMMARY" | awk -F'critical=' '{print $2}' | awk '{print $1}')
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          echo "Report preview:"
          head -8 /tmp/audit-report.md

      - name: Upload audit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: /tmp/audit-report.md
          if-no-files-found: error

      # Always surface the full report in the run summary (job logs expire; the
      # Actions summary + artifact persist). Works for cron/dispatch/PR alike.
      - name: Append report to run summary
        run: |
          {
            echo "## Dependency Audit"
            echo ""
            cat /tmp/audit-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      # PRs only: post (or update) the report as a comment. The marker lets us
      # find and rewrite the previous report instead of stacking comments on
      # every push. Skipped on schedule/dispatch — there is no PR to comment on.
      - name: Post report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/audit-report.md', 'utf8');
            const marker = '<!-- dependency-audit-report -->';
            const body = marker + '\n' + report;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log('Updated existing audit comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created audit comment');
            }

      # Fail the build on new critical advisories (PRs AND the daily cron, so a
      # red morning run is the alert that a critical advisory landed upstream).
      - name: Fail on critical advisories
        if: steps.audit.outputs.critical != '0'
        run: |
          echo "::error::CRITICAL dependency advisory(ies) found — see the audit report above."
          exit 1
