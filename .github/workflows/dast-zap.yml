name: "DAST: ZAP scan (staging-shaped stack)"

# Row 5.5's missing scanner. This is the *only* workflow that attacks a running
# stack: everything else in CI is static, unit-level or image-level.
#
# What it scans: the backend image built from this commit, brought up with the
# AI flag ON and the staging blueprint's gates (APP_ENV=production,
# TCDN_AI_ENVIRONMENT=production, STAGING_DEPLOYMENT=true, Paystack test key
# only). Postgres/Redis/MinIO/MediaMTX come from the root compose file. The
# frontend and Caddy are NOT started — Next.js is a separate surface and its
# own checks live in security.yml / ci-e2e.yml.
#
# Three passes, because the API has two authentication schemes and a session
# cannot stand in for the other:
#   1. unauthenticated;
#   2. authenticated as a seeded **account** (session JWT) — covers everything
#      under /auth, /files, /billing, /admin, /api/live;
#   3. authenticated as a seeded **AI API key** — /api/ai/v1/* refuses a JWT
#      (`authenticate` wants a scoped `tcdn_ai_` key), so without this pass the
#      whole AI surface would only ever be scanned as an anonymous caller.
# Each authenticated pass goes through a loopback proxy that adds the header
# (`.github/zap/auth_proxy.py`); no credential touches the checkout.
#
# Findings are reported as they are. The job fails on any HIGH alert and
# writes nothing to a rules file to silence one.
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/zap/**"
      - ".github/workflows/dast-zap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-zap-${{ github.ref }}
  cancel-in-progress: true

env:
  # ── Compose interpolation (the root file requires these) ──────────────────
  JWT_SECRET: "this-is-a-32-char-secret-for-testing-only!!"
  POSTGRES_USER: user
  POSTGRES_PASSWORD: ci-test-password
  MINIO_ROOT_PASSWORD: ci-test-minio-password
  MEDIAMTX_HOOK_SECRET: "ci-test-hook-secret"

  # ── The stack shape: production gates, throwaway deployment ───────────────
  APP_ENV: production
  APP_URL: https://zap.ci.invalid
  STAGING_DEPLOYMENT: "true"
  ENABLE_TCDN_AI: "true"
  TCDN_AI_ENVIRONMENT: production
  TCDN_AI_REQUIRE_TLS: "true"
  TCDN_AI_ALLOW_SIMULATED_ATTESTATION: "false"
  TCDN_AI_ALLOW_DEV_STUB_BACKEND: "false"
  TCDN_AI_PAYMENT_PROVIDER: paystack
  # A test-mode-shaped key that is not a credential: production refuses `fake`,
  # and every webhook the scanner forges fails its signature check.
  TCDN_AI_PAYSTACK_SECRET_KEY: "sk_test_zap_ci_not_a_real_credential"
  TCDN_AI_API_KEY_PEPPER: "ci-zap-pepper-32-characters-long!!"
  TCDN_AI_SIGNUP_CREDITS: "500"
  TCDN_AI_SIGNUP_ALLOW_AUTO_VERIFIED: "true"

  # 2FA is required in production by default and login would return only an
  # mfa_token; the authenticated pass needs a session, so this stack turns the
  # enrollment requirement off explicitly (and .github/zap/seed.py fails loudly
  # if the gate is ever hit anyway). The 2FA surface itself is covered by
  # backend/tests/test_auth.py and the E2E flows, not by ZAP.
  MFA_REQUIRED: "false"
  # The per-IP global limiter is a product control; at its shipped 300/min a
  # ~100-endpoint active scan would report 429s instead of responses. Raised
  # for the scanner only — the AI per-key limiter and every other throttle stay
  # exactly as shipped.
  RATE_LIMIT_GLOBAL: "20000"

  ZAP_TARGET: http://127.0.0.1:8000

jobs:
  zap:
    name: ZAP (unauthenticated + JWT + AI key, flag on)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare the scan directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zap/reports"
          cp .github/zap/plan-unauth.yaml .github/zap/plan-auth.yaml \
             .github/zap/plan-auth-ai.yaml .github/zap/seed.py \
             .github/zap/summarise.py "$RUNNER_TEMP/zap/"
          # The ZAP container writes as its own uid; the token lives in this
          # directory, so it is 777 for the scan and never uploaded.
          chmod -R 777 "$RUNNER_TEMP/zap"

      - name: Build the backend image
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml \
            build backend

      # The production AI gates refuse to boot without an injected keyring.
      # Generated by the project's own initialiser *inside the image*, moved
      # straight into the job env, never printed and never committed; it dies
      # with the runner.
      - name: Generate a throwaway coordinator keyring
        run: |
          set -euo pipefail
          keyring=$(docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml \
            run --rm --no-deps -T \
            -e TCDN_AI_ENVIRONMENT=development -e ENABLE_TCDN_AI=false \
            backend python scripts/ai_keyring_init.py --name zap-ci \
            | grep -E '^\{' | head -1)
          test -n "$keyring" || { echo "keyring initialiser printed no JSON" >&2; exit 1; }
          {
            echo "TCDN_AI_COORDINATOR_KEYRING_JSON<<__ZAP_KEYRING__"
            echo "$keyring"
            echo "__ZAP_KEYRING__"
          } >> "$GITHUB_ENV"
          echo "keyring generated (not printed)"

      - name: Bring up the stack
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml \
            up -d --build backend
          for _ in $(seq 1 90); do
            if curl -fsS "$ZAP_TARGET/health" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS "$ZAP_TARGET/health"
          docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml ps

      - name: Seed the test account (and prove its token works)
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/zap/seed.py" \
            --base-url "$ZAP_TARGET" \
            --token-out "$RUNNER_TEMP/zap/token"

      # /api/ai/v1/* authenticates with a scoped API key, not the session. Issue
      # one for the same seeded account, inside the container, where the
      # database, Redis and the keyring already are. Only the key is printed on
      # stdout; the file is written 0600 and is never uploaded.
      - name: Seed an AI API key (for the /api/ai/v1 pass)
        run: |
          set -euo pipefail
          key=$(docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml \
            exec -T backend python - < .github/zap/seed_ai_key.py \
            | grep -Eo 'tcdn_ai_[A-Za-z0-9_-]+' | tail -1)
          test -n "$key" || { echo "the AI key seed printed no key" >&2; exit 1; }
          umask 077
          printf '%s' "$key" > "$RUNNER_TEMP/zap/ai-key"
          echo "AI key issued (not printed)"

      # Exported from the running app rather than fetched over HTTP: production
      # turns /docs and /openapi.json off, and the spec must describe the routes
      # this commit actually mounts with the flag on.
      - name: Export the OpenAPI document from the running app
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml \
            exec -T backend python -c \
            'import json; from app.main import app; print(json.dumps(app.openapi()))' \
            > "$RUNNER_TEMP/zap/api.json"
          python3 - "$RUNNER_TEMP/zap/api.json" <<'PY'
          import json, sys
          spec = json.load(open(sys.argv[1]))
          paths = spec.get("paths", {})
          ai = [p for p in paths if p.startswith("/api/ai")]
          print(f"openapi: {len(paths)} paths, {len(ai)} under /api/ai")
          if len(ai) == 0:
              raise SystemExit("the AI routes are absent from the exported spec — "
                               "the flag did not reach the app")
          PY

      - name: Pull the ZAP image
        run: docker pull zaproxy/zap-stable

      - name: ZAP — unauthenticated pass
        run: |
          set -euo pipefail
          docker run --rm --network=host \
            -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            zaproxy/zap-stable zap.sh -cmd -autorun /zap/wrk/plan-unauth.yaml \
            2>&1 | tee "$RUNNER_TEMP/zap/reports/scan-unauth.log"

      # Both passes return similar alert sets, which is exactly what a bearer
      # header that never got applied would look like. Record the truth before
      # the second pass rather than assuming the Replacer rule worked.
      - name: Baseline — authenticated coverage so far
        run: bash .github/zap/authme.sh before

      # ZAP's Replacer rule did not apply the bearer header (the first run of
      # this job proved it: 46 requests to /auth/me, all 401). The authenticated
      # pass therefore goes through a loopback proxy that adds the header to
      # every request, and the step below re-checks that it actually worked.
      - name: Start the auth proxy
        run: |
          set -euo pipefail
          python3 .github/zap/auth_proxy.py \
            --token-file "$RUNNER_TEMP/zap/token" \
            --listen 8001 --upstream-port 8000 \
            > "$RUNNER_TEMP/zap/reports/auth-proxy.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/health
          # A read-only JWT route: /auth/me also exposes DELETE, which is
          # excluded from this context (it deletes the seeded account and
          # cascades to the AI keys the next pass needs).
          curl -fsS http://127.0.0.1:8001/auth/referral >/dev/null 2>&1 \
            && echo "proxy reaches /auth/referral"

      - name: ZAP — authenticated pass (session JWT)
        run: |
          set -euo pipefail
          docker run --rm --network=host \
            -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            zaproxy/zap-stable zap.sh -cmd -autorun /zap/wrk/plan-auth.yaml \
            2>&1 | tee "$RUNNER_TEMP/zap/reports/scan-auth.log"

      # Same proxy, second listener, different credential: the seeded account's
      # inference-scoped AI key, sent in the header the AI surface documents
      # (``X-API-Key``) rather than as a bearer token. Two proofs, because a
      # wrong key and a proxy that drops the header look identical from the
      # scanner's side: the direct call goes straight to :8000 with the key, the
      # proxied call goes through :8002 with no credential of its own.
      - name: Start the AI-key proxy
        run: |
          set -euo pipefail
          python3 .github/zap/auth_proxy.py \
            --token-file "$RUNNER_TEMP/zap/ai-key" \
            --listen 8002 --upstream-port 8000 \
            --header-name X-API-Key --header-prefix "" \
            > "$RUNNER_TEMP/zap/reports/auth-proxy-ai.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8002/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "key length: $(wc -c < "$RUNNER_TEMP/zap/ai-key")"
          direct=$(curl -s -o "$RUNNER_TEMP/zap/reports/ai-direct.json" -w '%{http_code}' \
            -H "X-API-Key: $(cat "$RUNNER_TEMP/zap/ai-key")" \
            http://127.0.0.1:8000/api/ai/v1/balance)
          proxied=$(curl -s -o "$RUNNER_TEMP/zap/reports/ai-proxied.json" -w '%{http_code}' \
            http://127.0.0.1:8002/api/ai/v1/balance)
          echo "AI key /api/ai/v1/balance -> direct $direct, proxied $proxied"
          if [ "$direct" != "200" ] || [ "$proxied" != "200" ]; then
            echo "--- direct body ---"; head -c 400 "$RUNNER_TEMP/zap/reports/ai-direct.json" || true; echo
            echo "--- proxied body ---"; head -c 400 "$RUNNER_TEMP/zap/reports/ai-proxied.json" || true; echo
            echo "the seeded AI key was not accepted — an 'authenticated' AI scan would be a lie" >&2
            # "the account is gone" and "the hash does not match" are different
            # bugs; say which one this is instead of leaving a bare 401.
            docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml \
              exec -T backend python - <<'PY' || true
          import asyncio
          from app.database import get_db_pool

          async def main() -> None:
              pool = await get_db_pool()
              uid = await pool.fetchval(
                  "SELECT id FROM users WHERE lower(email) = lower('zap-scan@example.test')"
              )
              keys = await pool.fetchval("SELECT count(*) FROM ai_api_keys")
              print(f"diagnostic: seeded account present={uid is not None}, ai_api_keys rows={keys}")

          asyncio.run(main())
          PY
            exit 1
          fi

      - name: ZAP — authenticated pass (AI API key)
        run: |
          set -euo pipefail
          docker run --rm --network=host \
            -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            zaproxy/zap-stable zap.sh -cmd -autorun /zap/wrk/plan-auth-ai.yaml \
            2>&1 | tee "$RUNNER_TEMP/zap/reports/scan-auth-ai.log"

      # Always runs: if a scan step failed, the findings that *were* produced
      # still get printed instead of disappearing behind the first error. The
      # summariser exits 2 when a report is missing, so a broken scan cannot
      # pass as a clean one.
      # Fails when the pass added no successful request to a JWT-only route: an
      # "authenticated" report that never authenticated is worse than no report.
      - name: Prove the authenticated pass authenticated
        run: bash .github/zap/authme.sh after

      # ZAP's own report only carries passive/active alert rules. The proxy log
      # is where server errors show up: a 5xx on malformed input is a finding
      # even when no rule names it.
      - name: Tally responses from both proxies
        if: always()
        run: |
          set -euo pipefail
          for pair in "auth-proxy coverage" "auth-proxy-ai coverage-ai"; do
          set -- $pair
          python3 - "$RUNNER_TEMP/zap/reports/$1.log" "$RUNNER_TEMP/zap/reports/$2.md" <<'PY'
          import collections, pathlib, sys

          log = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          rows = []
          for line in log.read_text(errors="replace").splitlines():
              # auth-proxy <METHOD> <path> -> <status>
              parts = line.split(" ")
              if len(parts) != 5 or parts[0] != "auth-proxy" or parts[3] != "->":
                  continue
              rows.append((parts[1], parts[2], parts[4]))
          total = len(rows)
          status = collections.Counter(r[2] for r in rows)
          five = collections.Counter(r[1].split("?")[0] for r in rows if r[2].startswith("5"))
          twos = collections.Counter(r[0] + " " + r[1].split("?")[0] for r in rows if r[2].startswith("2"))
          lines = ["# Scan coverage (authenticated pass, measured at the proxy)", ""]
          lines.append(f"{total} requests proxied.")
          lines += ["", "| Status | Requests |", "|---|---|"]
          lines += [f"| {code} | {count} |" for code, count in sorted(status.items(), key=lambda kv: -kv[1])]
          if five:
              lines += ["", "## 5xx responses (unhandled errors under scan)", "", "| Path | Count |", "|---|---|"]
              lines += [f"| `{p}` | {c} |" for p, c in five.most_common(15)]
          if twos:
              lines += ["", "## 2xx responses (what the session could actually reach)", "", "| Method + path | Count |", "|---|---|"]
              lines += [f"| `{p}` | {c} |" for p, c in twos.most_common(15)]
          lines[0] = lines[0].replace("the authenticated pass", sys.argv[1])
          out.write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          if total == 0:
              raise SystemExit(f"{sys.argv[1]} logged no requests — the pass did not run")
          PY
          cat "$RUNNER_TEMP/zap/reports/$2.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Summarise and fail on HIGH
        if: always()
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/zap/summarise.py" \
            --reports "$RUNNER_TEMP/zap/reports" \
            --out "$RUNNER_TEMP/zap/reports/zap-summary.md" \
            | tee "$GITHUB_STEP_SUMMARY"

      - name: Evidence bundle
        if: always()
        run: |
          {
            echo ""
            echo "## Stack"
            echo ""
            echo '```'
            docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml ps 2>&1 || true
            echo '```'
            echo ""
            echo "Target: \`$ZAP_TARGET\` · commit \`$GITHUB_SHA\` · run \`$GITHUB_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: ${{ runner.temp }}/zap/reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Logs on failure
        if: failure()
        run: |
          # A 500 under scan is a finding, and its cause is a traceback that a
          # plain tail drops (the scan issues thousands of requests). Pull the
          # tracebacks out of the whole log first, then the tail for context.
          echo "==== backend tracebacks ===="
          docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml \
            logs --no-color backend 2>&1 | awk '/Exception in ASGI application|Traceback \(most recent call last\)/{c=70} c&&c--' | tail -300 || true
          echo "==== backend ===="
          docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml \
            logs backend --tail 150 2>&1 || true
          echo "==== scan logs ===="
          tail -60 "$RUNNER_TEMP/zap/reports/scan-unauth.log" 2>/dev/null || true
          tail -60 "$RUNNER_TEMP/zap/reports/scan-auth.log" 2>/dev/null || true
          tail -60 "$RUNNER_TEMP/zap/reports/scan-auth-ai.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          pkill -f auth_proxy.py || true
          docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml down -v
