services:
  - type: web
    name: torrentcdn-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        # Canonical frontend domain — email reset/verify links, billing redirects, embed
        # URLs, and the CSP media/connect-src all derive from this. MUST match the exact
        # domain Vercel serves (www.torrentcdn.store, confirmed HTTP 200).
        # NOTE: the live Render dashboard env var currently overrides this with the stale
        # https://torrentcdn.com (proven by the prod CSP) — update it in the dashboard
        # to https://www.torrentcdn.store and redeploy for email links to work.
        value: https://www.torrentcdn.store
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # Canonical origins only — the apex (the bare torrentcdn.store host, no
        # www) 308-redirects to www so its Origin never occurs; check_domains.sh
        # enforces this.
        value: "https://torrent-cdn.vercel.app,https://www.torrentcdn.store"
      - key: TRUSTED_HOSTS
        value: ".onrender.com,.vercel.app,.torrentcdn.store,localhost"
      # Per-IP rate limits resolve the client from X-Forwarded-For ONLY when
      # the request arrived from a trusted proxy (below). Unset, the first XFF
      # entry is trusted from any peer — a client hitting this backend directly
      # (the public onrender.com URL) can forge the header to rotate past
      # login/register/upload limits (a startup warning is logged when unset).
      #
      # Topology (verified live): Render routes ALL onrender.com traffic
      # through Cloudflare (responses carry `server: cloudflare` + `cf-ray`),
      # so the DIRECT peer of every request to this backend is a Cloudflare
      # edge. Vercel-proxied traffic (vercel.json rewrites) arrives via
      # Cloudflare too, with the visitor IP in X-Forwarded-For followed by the
      # Vercel edge IP (appended by Cloudflare). get_client_ip() walks the
      # chain right-to-left skipping trusted hops, so both hop types must be
      # trusted for it to land on the real client IP.
      #
      # Ranges below: Cloudflare's published lists (https://www.cloudflare.com/
      # ips-v4 and ips-v6, refreshed 2026-09-06) + Vercel's ARIN-registered
      # netblocks (76.76.21.0/24 etc., refreshed 2026-09-06). Refresh Cloudflare
      # from the URLs above if the startup warning returns; Vercel's ranges
      # change rarely.
      - key: TRUSTED_PROXIES
        value: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32,143.13.0.0/16,155.121.0.0/16,198.169.1.0/24,198.169.2.0/24,216.150.1.0/24,216.150.16.0/24,216.198.79.0/24,216.230.84.0/24,216.230.86.0/24,64.239.109.0/24,64.239.123.0/24,64.29.17.0/24,66.33.60.0/24,76.76.21.0/24,2607:db00::/32"
      - key: CSP_REPORT_URL
        value: "/api/csp-report"
      # Same-origin proxy authentication: the frontend middleware stamps this
      # secret on every request it proxies here; per-IP rate limiting trusts
      # the client IP only from such requests (Vercel's egress IPs are dynamic
      # and can't be allow-listed — without this, ALL users share ONE rate
      # limit bucket). Set the SAME value on the Vercel project.
      - key: EDGE_PROXY_AUTH
        sync: false
      # ── Live streaming public endpoints ──────────────────────────────────
      # The dashboard builds the OBS setup card (RTMP server, HLS playback URL)
      # from these. Unset, the code falls back to localhost defaults — which is
      # what production showed before this ("rtmp://localhost:1935/live"),
      # unusable by OBS or viewers.
      #
      # PERMANENT endpoints: MediaMTX + Caddy run on an Oracle Always-Free VM
      # with a static public IP (see deploy/oracle/README.md — the runbook for
      # creating the VM, opening 80/443/1935, and the DNS A records for
      # rtmp./hls.torrentcdn.store). One-time setup; hostnames never change.
      - key: MEDIAMTX_RTMP_URL
        value: "rtmp://rtmp.torrentcdn.store"
      - key: MEDIAMTX_HLS_URL
        value: "https://hls.torrentcdn.store"
      - key: MINIO_SECURE
        value: "true"
      # REDIS_URL is wired to the managed Key Value instance below (blueprint
      # fromService → internal connection string). Presign upload sessions
      # survive instance recycling and rate limits become shared. No dashboard
      # value needed.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: torrentcdn-redis
          property: connectionString
      # Set these in Render dashboard:
      # - DATABASE_URL (Supabase PostgreSQL connection string)
      # - MINIO_ENDPOINT (Supabase Storage endpoint: project-ref.supabase.co)
      # - MINIO_ACCESS_KEY (Supabase S3 access key)
      # - MINIO_SECRET_KEY (Supabase S3 secret key)
      # - MINIO_BUCKET (Supabase storage bucket name)
      # - MINIO_PUBLIC_URL (Supabase Storage public URL)
      # - PAYSTACK_SECRET_KEY (Paystack Kenya — required for billing. Same key
      #   signs API calls AND webhooks. Get it at dashboard.paystack.com)
      # - PAYSTACK_CURRENCY (KES)
      # - PAYSTACK_PLAN_PRO / PAYSTACK_PLAN_BUSINESS (PLN_... codes from
      #   Paystack dashboard -> Products & plans)
      # - PAYSTACK_AMOUNT_PRO / PAYSTACK_AMOUNT_BUSINESS (smallest unit, KES cents)
      # Webhook endpoint: https://torrent-cdn.onrender.com/billing/webhook
      # Optional malware scanning (fail-open — uploads work with or without this).
      # Get a free key at https://www.virustotal.com — set it here to activate
      # hash-lookup + ≤32MB file scans on every finalized upload.
      - key: VIRUSTOTAL_API_KEY
        value: ""
      - key: RESEND_API_KEY
        value: ""  # ← Set this in Render dashboard (get a free key at https://resend.com/api-keys)
      - key: RESEND_FROM
        value: "TorrentCDN <noreply@torrentcdn.store>"  # Your verified domain
      # Bootstrap: set ADMIN_SETUP_ENABLED=true + a random ADMIN_SETUP_TOKEN,
      # call POST /auth/setup once with the token in the X-Admin-Setup-Token
      # header, then remove both. Admins are NOT auto-created on first
      # registration. The token is REQUIRED if set — without it a flag left on
      # lets any authenticated user self-promote.
      # - key: ADMIN_SETUP_ENABLED
      #   value: "true"
      # - key: ADMIN_SETUP_TOKEN
      #   generateValue: true
      # Scaling (paid plans): the Dockerfile reads WEB_CONCURRENCY for gunicorn
      # workers (default 1 — right for free tier's 0.1 CPU). On a bigger plan
      # raise it; chunked-upload AND presign sessions are Redis-backed, so a
      # session created on one worker continues on another. Keep
      # workers × DB_POOL_MAX_SIZE under the Supabase pooler's connection cap
      # (free tier ~60) or PgBouncer rejects connections.
      # DB_POOL_ACQUIRE_TIMEOUT bounds how long a request waits for a pool slot
      # under saturation → fast retryable 503 instead of a hang.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "10"
      - key: DB_POOL_ACQUIRE_TIMEOUT
        value: "10"

  # Keep-alive pinger — hits /health every 5 minutes to prevent free-tier cold starts.
  # Render suspends idle free instances after ~15 min; this cron keeps the web service
  # alive. The pinger is a 2-second Python script with zero dependencies.
  - type: cron
    name: torrentcdn-keepalive
    schedule: "*/5 * * * *"
    region: oregon
    plan: free
    env: python
    buildCommand: ""
    startCommand: "python backend/scripts/keepalive_pinger.py"
    envVars:
      - key: WEB_SERVICE_URL
        value: "https://torrent-cdn.onrender.com"

  # Managed Redis (Render Key Value, Valkey 8 — a drop-in for redis-py). Presign
  # upload sessions are stored here with a 30-min TTL, so a session survives a
  # web-instance recycle between presign and finalize; the per-IP upload + global
  # rate limiters and analytics also use it. Free plan: ~25MB RAM, no persistence
  # — fine for short-TTL sessions. All traffic uses Render's private network
  # (internal URL, same region), so external connections are fully blocked.
  - type: keyvalue
    name: torrentcdn-redis
    plan: free
    region: oregon
    # Every key this app stores carries a TTL — evict only those, never delete
    # non-expiring data.
    maxmemoryPolicy: volatile-lru
    # Block ALL external connections: the web service reaches this instance over
    # the private network (internal URL, unauthenticated by default).
    ipAllowList: []
    # ── Durability note (Aug 2026) ──
    # The FREE plan has NO persistence and its instance can be recycled/paused
    # (the same free-tier behavior that cold-starts the web service). A recycle
    # mid-uptime kills the backend's cached client connections — the cause of
    # the Aug 2026 site-wide 500s (unguarded redis.get/incr/expire in the
    # global rate limiter). The app is now resilient to this by design:
    #   - database.get_redis() liveness-checks the cached client on every call
    #     and resets it on failure, so callers fall back to in-memory limiters
    #     and the next request reconnects automatically (self-healing).
    #   - The client is created with socket timeouts (5s), health_check_interval
    #     (30s), and a bounded reconnect retry, so a dead/stuck connection
    #     surfaces as a fast error instead of a hang.
    # Consequence: rate-limit counters and presign/upload sessions are lost on
    # a recycle (short-TTL, acceptable on free). If cross-recycle durability is
    # ever required, upgrade this instance to a paid plan with persistence (or
    # point REDIS_URL at a managed provider); note the internal connection
    # string can change when the instance is recreated, so a process that
    # outlives a recycle still re-reads REDIS_URL only on restart — another
    # reason the fail-open path exists.
