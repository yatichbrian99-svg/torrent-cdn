services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: torrentcdn
    # Loopback-only: never expose the database to the LAN/0.0.0.0 (dev stacks
    # have been scraped via exposed default-cred Postgres/Redis on public hosts).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d torrentcdn"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Pinned to a specific release — :latest silently drifts (and has broken
    # dev stacks before). Bump deliberately when a new MinIO release is wanted.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Live streaming: MediaMTX (RTMP ingest → HLS) ─────────────────────────
  # Media is MediaMTX's job; the backend only integrates with it (auth hook,
  # Control API status polling, playback URL minting). ALL MediaMTX HTTP
  # surfaces are internal: HLS (8888) is fetched by the backend, and the
  # Control API (9997) + metrics (9998) are loopback-only — NEVER publish
  # them to the LAN/0.0.0.0. RTMP (1935) is the only client-facing port and
  # is loopback-only in dev too (production terminates it at a TLS edge).
  mediamtx:
    # Built from deploy/mediamtx/Dockerfile: upstream distroless image + a
    # busybox /bin/sh so the runOnReady/runOnNotReady path hooks can execute
    # (they notify the backend the moment a stream goes ready/offline).
    build:
      context: .
      dockerfile: deploy/mediamtx/Dockerfile
    image: torrentcdn/mediamtx:1.11.3-sh
    restart: unless-stopped
    environment:
      # MediaMTX reads overrides from MTX_-prefixed env vars (it does NOT
      # interpolate ${VAR} inside its YAML). The shared secret travels in the
      # URL; MediaMTX → backend is container-to-container, never public.
      # MEDIAMTX_BACKEND_HOST lets a host-run backend receive hooks in dev
      # (e.g. host.docker.internal); the compose service name is the default.
      MTX_AUTHHTTPADDRESS: http://${MEDIAMTX_BACKEND_HOST:-backend}:8000/api/internal/mediamtx/auth?secret=${MEDIAMTX_HOOK_SECRET:?MEDIAMTX_HOOK_SECRET must be set}
      MTX_HLSSEGMENTDURATION: ${LIVE_HLS_SEGMENT_DURATION:-2s}
      MTX_HLSPARTDURATION: ${LIVE_HLS_PART_DURATION:-700ms}
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-localhost}
      # runOnReady/runOnNotReady hook target + secret (consumed by the hook
      # command via $MEDIAMTX_READY_HOOK_URL / $MEDIAMTX_HOOK_SECRET).
      MEDIAMTX_READY_HOOK_URL: http://${MEDIAMTX_BACKEND_HOST:-backend}:8000/api/internal/mediamtx
      MEDIAMTX_HOOK_SECRET: ${MEDIAMTX_HOOK_SECRET}
    ports:
      # RTMP bind is 127.0.0.1 in dev; the edge profile rebinds it to the LAN
      # interface (0.0.0.0) so the router port-forward can reach MediaMTX.
      - "${MEDIAMTX_RTMP_BIND:-127.0.0.1}:1935:1935"   # RTMP ingest (publishers)
      - "127.0.0.1:8888:8888"   # HLS (fetched by backend + reverse proxy)
      - "127.0.0.1:8889:8889"   # WebRTC (optional)
      - "127.0.0.1:9997:9997"   # Control API (INTERNAL ONLY)
      - "127.0.0.1:9998:9998"   # Metrics (INTERNAL ONLY)
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    extra_hosts:
      # lets MTX_AUTHHTTPADDRESS reach a backend running on the Docker host
      - "host.docker.internal:host-gateway"
    # NO container healthcheck: the MediaMTX image is distroless (no shell,
    # no wget/curl), so a CMD-SHELL probe can never run. MediaMTX health is
    # observed by the backend instead — see GET /api/health/live
    # (mediamtx_reachable) and the periodic monitor's fail-open polling.

  # ── Edge profile: permanent public URLs (Option A) ────────────────────────
  # Opt-in via `--profile edge` so dev stacks are byte-for-byte unchanged.
  # See deploy/ddns/README.md for the one-time operator setup.
  ddns:
    # Keeps the rtmp./hls. A records pointed at this machine's current public
    # IP via Namecheap's built-in Dynamic DNS (no API token, no DNS migration
    # — one DDNS password is the whole credential surface). Busybox-only:
    # wget+grep, zero package installs at runtime.
    image: alpine:3.20
    restart: unless-stopped
    command: sh /usr/local/bin/update_dns.sh
    volumes:
      - ./deploy/ddns/update_dns.sh:/usr/local/bin/update_dns.sh:ro
      - ddns_state:/data
    environment:
      # Intentionally NOT :? guards — compose interpolates the whole file even
      # without the edge profile, and dev stacks must not need the secret. The
      # updater script fails fast with a clear message at runtime instead.
      NAMECHEAP_DDNS_PASSWORD: ${NAMECHEAP_DDNS_PASSWORD:-}
      DDNS_DOMAIN: ${DDNS_DOMAIN:-torrentcdn.store}
      HOSTS: ${DDNS_HOSTS:-rtmp,hls}
      INTERVAL: "300"
    profiles: ["edge"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/torrentcdn
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BUCKET: torrent-cdn-files
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a random value of 32+ characters}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-sk_test_xxx}
      PAYSTACK_CURRENCY: ${PAYSTACK_CURRENCY:-KES}
      PAYSTACK_PLAN_PRO: ${PAYSTACK_PLAN_PRO:-PLN_pro_monthly}
      PAYSTACK_PLAN_BUSINESS: ${PAYSTACK_PLAN_BUSINESS:-PLN_business_monthly}
      PAYSTACK_AMOUNT_PRO: ${PAYSTACK_AMOUNT_PRO:-400000}
      PAYSTACK_AMOUNT_BUSINESS: ${PAYSTACK_AMOUNT_BUSINESS:-1200000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,frontend}
      # ── Live streaming ──
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL:-http://mediamtx:9997}
      MEDIAMTX_RTMP_URL: ${MEDIAMTX_RTMP_URL:-rtmp://localhost:1935}
      # container-internal default: reach MediaMTX over the compose network
      # (a localhost default is only correct for host-run backends)
      MEDIAMTX_HLS_URL: ${MEDIAMTX_HLS_URL:-http://mediamtx:8888}
      MEDIAMTX_WEBRTC_URL: ${MEDIAMTX_WEBRTC_URL:-}
      MEDIAMTX_HOOK_SECRET: ${MEDIAMTX_HOOK_SECRET:?MEDIAMTX_HOOK_SECRET must be set}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:-}
      PUBLIC_PLAYBACK_DOMAIN: ${PUBLIC_PLAYBACK_DOMAIN:-http://localhost:8888}
      # per-IP-per-channel viewer budget (join/heartbeat/availability).
      # Raise for load tests / demos with many simulated viewers from one IP.
      LIVE_TOKEN_RATE_LIMIT: ${LIVE_TOKEN_RATE_LIMIT:-240}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-300}
    # Loopback-only like the datastores: the API carries no TLS of its own in
    # the dev stack and Caddy is the only intended front door — never expose it
    # to the LAN/0.0.0.0.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # started (not healthy): MediaMTX has no workable in-container healthcheck
      # (distroless image) and the backend tolerates it being briefly down.
      mediamtx:
        condition: service_started
    volumes:
      - ./backend:/app
      - torrent_temp:/tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    expose:
      - "3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SITE_ADDR: ${SITE_ADDR:-http://localhost}
      ACME_AGREE: "true"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/hls.caddy:/etc/caddy/hls.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  torrent_temp:
  caddy_data:
  caddy_config:
  ddns_state:
