# Ruff lint configuration for the FastAPI backend.
# Run with:  .venv/bin/python -m ruff check app tests scripts
#
# `select` is intentionally unset: ruff 0.16's default ruleset (E4/E7/E9/F
# plus I, UP, B, S, SIM, RUF, PL, PIE, ASYNC, EXE) is the baseline this repo
# lints against. Only intentional deviations are listed below.
target-version = "py311"
line-length = 88

[lint]
ignore = [
    # Deliberate fail-open / best-effort patterns: malware scan, email
    # delivery, and Redis/DB fallbacks catch broadly so a helper failure
    # never crashes a request path. Bandit's blind-except rule is noise by
    # design here.
    "BLE001",
    # Best-effort cleanup and Redis-down fallbacks intentionally swallow
    # exceptions (each site carries an explanatory comment).
    "S110",
    "S112",
    # The upload pipeline's small bounded file ops (chunk writes, magic-byte
    # validation reads) run between awaits; heavy work is already offloaded
    # via asyncio.to_thread.
    "ASYNC230",
]

[lint.per-file-ignores]
# Ops/demo/e2e scripts: the wait_for(lambda: (lambda rr: ...)(call)) IIFE
# shape, ffmpeg log file handles deliberately outliving the block (the child
# process owns the fd), and hand-rolled loop counters are idiomatic in
# throwaway tooling — rewriting them adds churn without value.
"scripts/*" = ["SIM115", "PLC3002", "SIM113"]

[lint.flake8-bugbear]
# FastAPI idioms: Depends()/Security()/File() in argument defaults are the
# framework's documented way to inject request-scoped values.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.HTTPBearer",
    "fastapi.security.HTTPBearer",
]
