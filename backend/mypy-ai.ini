# Non-strict mypy, deliberately SCOPED to the TCDN-AI package and its SDK.
#
# The rest of the backend predates type checking and is not annotated; imposing
# mypy on it would be a rewrite, not a gate. These two trees are new code with
# annotations already in place, so non-strict checking catches real mistakes
# (wrong attribute, wrong argument, None where a value is required) without
# demanding full annotation coverage.
#
# "Non-strict" here means: no --disallow-untyped-defs, no --strict, no
# --check-untyped-defs. Bodies of *annotated* functions are still checked.
[mypy]
python_version = 3.12
files = app/ai, tcdn_ai_sdk

# Third-party packages ship partial or no stubs (resend, python-jose, boto3…).
# Reporting that as an error would only teach people to add blanket ignores.
ignore_missing_imports = True

# Cheap, high-signal checks that do not require annotating anything new.
no_implicit_optional = True
warn_redundant_casts = True
show_error_codes = True
pretty = True

# Tests exercise deliberately broken inputs and monkeypatch aggressively.
exclude = (?x)(^tests/)
